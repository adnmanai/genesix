<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141419"/>
    </linearGradient>
    <linearGradient id="polyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="polyGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f355da"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="polyGrad3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Glowing Polyhedron Facets -->
  <g filter="url(#glow)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2.5" stroke-linejoin="round">
    <!-- Top Central Triangle -->
    <polygon points="256,96 170,220 342,220" fill="url(#polyGrad1)" opacity="0.95"/>
    
    <!-- Left Top Flank -->
    <polygon points="256,96 110,180 170,220" fill="#00c6ff" opacity="0.75"/>
    
    <!-- Right Top Flank -->
    <polygon points="256,96 342,220 402,180" fill="#9d4edd" opacity="0.8"/>
    
    <!-- Left Mid Triangle -->
    <polygon points="110,180 170,220 140,320" fill="#0072ff" opacity="0.7"/>
    
    <!-- Right Mid Triangle -->
    <polygon points="402,180 342,220 372,320" fill="#7209b7" opacity="0.85"/>
    
    <!-- Center Inverted Triangle -->
    <polygon points="170,220 342,220 256,360" fill="url(#polyGrad2)" opacity="0.9"/>
    
    <!-- Center to Left Bottom -->
    <polygon points="170,220 140,320 256,360" fill="#3a0ca3" opacity="0.8"/>
    
    <!-- Center to Right Bottom -->
    <polygon points="342,220 256,360 372,320" fill="#b5179e" opacity="0.85"/>
    
    <!-- Bottom Point Left -->
    <polygon points="140,320 256,360 256,416" fill="#4361ee" opacity="0.9"/>
    
    <!-- Bottom Point Right -->
    <polygon points="372,320 256,360 256,416" fill="#f72585" opacity="0.95"/>
  </g>

  <!-- Central core point node -->
  <circle cx="256" cy="256" r="10" fill="#ffffff" filter="url(#glow)"/>
</svg>
